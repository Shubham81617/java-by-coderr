<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <span>Add element in Array</span>
    <input type="text"  id="change1" placeholder="Array postion">
    <input type="text"  id="change2" placeholder="array input">
    <button onclick="updateArray(event)">Click ME</button>

    <script>
        let user = ["sam", "ramesh", "peter", "john", "raju"];
        console.log(user);

        function updateArray(event){
           
            let input1=document.getElementById("change1").value;
            let input2=document.getElementById("change2").value;

            user.splice(input1,0,input2);
            console.log(user);
            
        }
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <input onblur="blurInput(event)" type="text" placeholder="Enter your namne" id="change1"><br><br>
    <span id="change2"></span>

    <script>
        function blurInput(event){
            console.log(event.target.value);
            let update =event.target.value;
       let update1= document.getElementById("change2");
        update1.style.display="block";
       if(update.length<4){
        update1.textContent = "min 4 character allowed"
       }else if(update.length>11){
                update1.textContent = "max 10 character allowed"
       }else{
        update1.textContent="";
        update1.style.display="none";
       }
    }
    </script>
</body>

</html>
